# ============================================================
#  Sparkle / FlClash  纯自建 DoH  覆写文件
#  用法：客户端 → 覆写 → 导入此文件，然后开启即可
#
#  前提：已在 Sparkle「设置 → 高级设置」关闭"接管 DNS 设置"
#
#  特点：
#  - 所有 DNS 请求全部走自建 DoH（ccjccj.online）
#  - 仅做 DNS 净化，不含分流规则
#  - 若需整体分流，请使用 override.yaml
# ============================================================

# ---------- DNS 净化（全部走自建 DoH） ----------
dns:
  enable: true
  # 主 DNS 全部用自建 DoH
  nameserver:
    - https://ccjccj.online/doh
  # 兜底 DNS：自建 DoH 不可用时用 Google 备用
  fallback:
    - https://ccjccj.online/doh
    - https://dns.google/dns-query
  # 国内域名也走自建 DoH（保持纯净解析）
  nameserver-policy:
    "geosite:cn":
      - https://ccjccj.online/doh
    "geosite:geolocation-!cn":
      - https://ccjccj.online/doh
      - https://dns.google/dns-query
  # 代理节点域名解析：用 Google DNS，避免依赖自建 DoH
  proxy-server-nameserver:
    - https://dns.google/dns-query
  respect-rules: true