# ============================================================
#  Sparkle / FlClash  纯自建 DoH  覆写文件（性能优化版）
#  用法：客户端 → 覆写 → 导入此文件，然后开启即可
#
#  相对旧版的变化：
#  1. 国内域名改为直连阿里/腾讯 DoH：解析路径从
#     「客户端 → 代理出口 → CF Worker → 阿里」缩为「客户端 → 阿里」，
#     延迟从 ~150-300ms 降到 ~20-50ms，且 ECS 天然是家宽视角，
#     返回的国内 CDN 节点最准（旧版带的是代理出口子网，CDN 调度偏）
#  2. 删除 fallback 双查询：mihomo 的 fallback 语义是 nameserver 与
#     fallback 同时各查一遍再比对，旧配置每次解析实际发 2 路查询，纯浪费
#  3. 国外域名继续走自建 DoH：代理出口视角解析（对走代理的连接最准）
#     + 广告净化 + CNAME 链检查
#
#  ⚠ 取舍说明：
#  - 国内域名不再经过自建 DoH，DNS 层不拦国内广告；
#    请同时导入 override.yaml，由 anti-AD 规则层在连接层拦截
#  - 若你只想要「全部走自建 DoH」的旧行为，删掉 nameserver-policy 段即可
# ============================================================

dns:
  enable: true
  # 默认（国外域名）：自建 DoH，代理出口视角解析 + 净化
  nameserver:
    - https://ccjccj.online/doh
  # 国内域名：直连国内公共 DoH（两路竞速，先到先用）
  nameserver-policy:
    "geosite:cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
  # 代理节点域名解析：用 Google DNS，避免依赖自建 DoH
  proxy-server-nameserver:
    - https://dns.google/dns-query
  # DNS 请求的转发跟随分流规则：国内 DoH 直连、自建 DoH 走代理
  respect-rules: true
  cache: true
