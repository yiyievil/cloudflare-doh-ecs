# ============================================================
#  Sparkle / FlClash 整体分流 + DNS 净化  覆写文件（Mihomo 内核）
#  用法：客户端 → 覆写 → 导入此文件，然后开启即可
# ============================================================

# ---------- 1. DNS 净化 ----------
# 国内域名走国内 DoH（干净快），海外域名走自建 DoH（不污染）
dns:
  enable: true
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://ccjccj.online/doh
    - https://dns.google/dns-query
  nameserver-policy:
    "geosite:cn":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:geolocation-!cn":
      - https://ccjccj.online/doh
      - https://dns.google/dns-query
  proxy-server-nameserver:
    - https://ccjccj.online/doh
  respect-rules: true

# ---------- 2. 整体分流规则 ----------
# 这些规则会插到订阅自带规则之前，优先级更高。
# 海外 DNS 已全部使用自建 DoH：https://ccjccj.online/doh
#
# 注意：请把下面的 PROXY 改成你订阅里的主代理组名
# （多数订阅叫 PROXY 或 🚀 节点选择，若不对请到"代理"页面查看）
+rules:
  # 2.1 优先走代理：fut.gg 相关（屏蔽中国大陆 IP）
  - DOMAIN-SUFFIX,fut.gg,PROXY
  - DOMAIN-SUFFIX,stormstrike.gg,PROXY
  - DOMAIN-SUFFIX,easports.com,PROXY
  - DOMAIN-SUFFIX,ea.com,PROXY
  - DOMAIN-SUFFIX,origin.com,PROXY
  - DOMAIN-SUFFIX,eaapp.com,PROXY

  # 2.2 广告 / 恶意 / 追踪 域名拦截
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,private,REJECT

  # 2.3 国内域名/IP 直连（不绕路，速度快）
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT

  # 2.4 其余海外域名默认走代理（整体分流核心）
  - GEOSITE,geolocation-!cn,PROXY

  # 2.5 局域网直连
  - GEOIP,LAN,DIRECT
  - GEOIP,private,DIRECT
