# ============================================================
#  Sparkle / FlClash  覆写文件（DNS 分流 + fut.gg 走代理）
#  用法：客户端 → 覆写 → 导入此文件，然后开启即可
#
#  重要：请先在 Sparkle 「设置 → 高级设置」里【关闭】"接管 DNS 设置"
#  否则本文件的 dns 配置会被 Sparkle 的 fake-ip 接管覆盖，导致打不开。
# ============================================================

# ---------- 1. DNS 分流（自建 DoH 做海外解析） ----------
dns:
  enable: true
  # redir-host 模式：域名解析成真实 IP，最稳妥，避免 fake-ip 与规则冲突
  enhanced-mode: redir-host
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://ccjccj.online/doh
    - https://dns.google/dns-query
  nameserver-policy:
    "geosite:cn":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:geolocation-!cn":
      - https://ccjccj.online/doh
      - https://dns.google/dns-query
  # 代理节点域名解析：必须用稳定可用的国外 DNS
  proxy-server-nameserver:
    - https://dns.google/dns-query
  respect-rules: true

# ---------- 2. fut.gg 走代理（DNS 分流无法替代） ----------
# 主代理组名：PROXY（请确认订阅里确实是这个名字）
+rules:
  - DOMAIN-SUFFIX,fut.gg,PROXY
  - DOMAIN-SUFFIX,stormstrike.gg,PROXY
  - DOMAIN-SUFFIX,easports.com,PROXY
  - DOMAIN-SUFFIX,ea.com,PROXY
  - DOMAIN-SUFFIX,origin.com,PROXY
  - DOMAIN-SUFFIX,eaapp.com,PROXY