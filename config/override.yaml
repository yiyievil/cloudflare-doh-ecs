# ============================================================
#  Sparkle / FlClash  纯分流  覆写文件
#  用法：客户端 → 覆写 → 导入此文件，然后开启即可
#
#  特点：
#  - 仅做分流，不含 DNS 配置（DNS 走订阅自带，或用 doh-only.yaml）
#  - 国内直连，海外走「🎯 分流主组」
#  - 「🎯 分流主组」自动包含当前订阅所有节点，切换任意订阅仍生效
#  - 广告 / 恶意域名拦截：anti-AD 专项规则集 + geosite 兜底（双层）
#
#  注意：若需 DNS 净化，请同时导入 doh-only.yaml（两个可并存）
# ============================================================

# ---------- 1. 分流主组（自动包含任意订阅的所有节点） ----------
+proxy-groups:
  - name: 🎯 分流主组
    type: select
    include-all: true
    include-all-proxies: true

# ---------- 2. 广告拦截规则集（anti-AD，每日自动更新） ----------
+rule-providers:
  anti-ad:
    type: http
    behavior: domain
    format: yaml
    interval: 86400
    path: ./rules/anti-ad.yaml
    url: https://anti-ad.net/clash.yaml

# ---------- 3. 整体分流规则 ----------
# 海外流量走「🎯 分流主组」。切换该组的节点，海外流量跟随。
# 无论切换哪个订阅，「🎯 分流主组」都会自动包含该订阅所有节点。
+rules:
  # 3.1 广告 / 恶意 / 追踪 域名拦截
  # anti-AD 对国内 App 广告覆盖更好；geosite 作第二层兜底。
  # 若某些 App 出现加载异常重试，可把 REJECT 改为 REJECT-DROP。
  - RULE-SET,anti-ad,REJECT
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,private,REJECT

  # 3.2 国内域名/IP 直连（不绕路，速度快）
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT

  # 3.3 局域网直连
  - GEOIP,LAN,DIRECT
  - GEOIP,private,DIRECT

  # 3.4 兜底：其余海外域名走「🎯 分流主组」
  - MATCH,🎯 分流主组
