# ============================================================
#  Sparkle / FlClash  覆写文件（DNS 分流 + fut.gg 走代理）
#  用法：客户端 → 覆写 → 导入此文件，然后开启即可
#
#  前提：已在 Sparkle「设置 → 高级设置」关闭"接管 DNS 设置"
#  代理组名：星尘云
# ============================================================

# ---------- 1. DNS 分流 ----------
# 国内域名走国内 DoH（干净快），海外域名走国外 DoH（不污染）
# 先用公共 DoH 确认稳定，后续可替换为自建 DoH
dns:
  enable: true
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  nameserver-policy:
    "geosite:cn":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:geolocation-!cn":
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
  proxy-server-nameserver:
    - https://dns.google/dns-query
  respect-rules: true

# ---------- 2. fut.gg 走代理 ----------
+rules:
  - DOMAIN-SUFFIX,fut.gg,星尘云
  - DOMAIN-SUFFIX,stormstrike.gg,星尘云
  - DOMAIN-SUFFIX,easports.com,星尘云
  - DOMAIN-SUFFIX,ea.com,星尘云
  - DOMAIN-SUFFIX,origin.com,星尘云
  - DOMAIN-SUFFIX,eaapp.com,星尘云