# ============================================================
#  Sparkle / FlClash  覆写文件（DNS 分流 + fut.gg 走代理）
#  用法：客户端 → 覆写 → 导入此文件，然后开启即可
#
#  前提：已在 Sparkle「设置 → 高级设置」关闭"接管 DNS 设置"
#
#  特性：
#  - 内置「🎯 分流主组」选择组，自动包含订阅所有节点
#  - fut.gg 走「🎯 分流主组」：你在代理页切换该组的节点，
#    覆写规则始终生效，无需每次改配置
# ============================================================

# ---------- 1. DNS 分流 ----------
# 国内域名走国内 DoH（干净快），海外域名走自建 DoH（不污染）
dns:
  enable: true
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://ccjccj.online/doh
    - https://dns.google/dns-query
  nameserver-policy:
    "geosite:cn":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:geolocation-!cn":
      - https://ccjccj.online/doh
      - https://dns.google/dns-query
  # 代理节点域名解析：用 Google DNS，不用自建 DoH
  proxy-server-nameserver:
    - https://dns.google/dns-query
  respect-rules: true

# ---------- 2. 分流主组（自动包含订阅所有节点） ----------
+proxy-groups:
  - name: 🎯 分流主组
    type: select
    include-all: true
    include-all-proxies: true

# ---------- 3. fut.gg 走「🎯 分流主组」 ----------
# 切换「🎯 分流主组」的节点即可，无需改覆写
+rules:
  - DOMAIN-SUFFIX,fut.gg,🎯 分流主组
  - DOMAIN-SUFFIX,stormstrike.gg,🎯 分流主组
  - DOMAIN-SUFFIX,easports.com,🎯 分流主组
  - DOMAIN-SUFFIX,ea.com,🎯 分流主组
  - DOMAIN-SUFFIX,origin.com,🎯 分流主组
  - DOMAIN-SUFFIX,eaapp.com,🎯 分流主组