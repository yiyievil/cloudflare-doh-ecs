# ============================================================
#  Sparkle / FlClash  整体分流 + DNS 净化 覆写文件
#  用法：客户端 → 覆写 → 导入此文件，然后开启即可
#
#  前提：已在 Sparkle「设置 → 高级设置」关闭"接管 DNS 设置"
#
#  特点：
#  - DNS 净化：国内走国内 DoH，海外走自建 DoH
#  - 整体分流：国内直连，海外跟随订阅主代理组"星尘云"
#  - 广告 / 恶意域名拦截
# ============================================================

# ---------- 1. DNS 净化 ----------
# 国内域名走国内 DoH（干净快），海外域名走自建 DoH（不污染）
dns:
  enable: true
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://ccjccj.online/doh
    - https://dns.google/dns-query
  nameserver-policy:
    "geosite:cn":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:geolocation-!cn":
      - https://ccjccj.online/doh
      - https://dns.google/dns-query
  # 代理节点域名解析：用 Google DNS，不用自建 DoH
  proxy-server-nameserver:
    - https://dns.google/dns-query
  respect-rules: true

# ---------- 2. 整体分流规则 ----------
# 出口"星尘云"= 订阅主代理组。你切换该组的节点，海外流量跟随。
# 若换订阅，请把"星尘云"改成新订阅的主代理组名。
+rules:
  # 2.1 广告 / 恶意 / 追踪 域名拦截
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,private,REJECT

  # 2.2 国内域名/IP 直连（不绕路，速度快）
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT

  # 2.3 局域网直连
  - GEOIP,LAN,DIRECT
  - GEOIP,private,DIRECT

  # 2.4 兜底：其余海外域名走订阅主代理组"星尘云"
  - MATCH,星尘云