# ============================================================
#  Sparkle / FlClash  覆写文件（最简测试版）
#  用法：客户端 → 覆写 → 导入此文件，然后开启即可
#
#  本版只做一件事：让 fut.gg 走代理。
#  - 完全不含 dns 配置块（避免覆盖订阅自带 DNS / fake-ip）
#  - 不含 MATCH / GEOSITE / GEOIP（避免干扰直连）
#  如果连这版都打不开，问题就在覆写机制或代理组名本身。
# ============================================================

# ---------- 仅 fut.gg 走代理 ----------
# 主代理组名：PROXY（请确认订阅里确实是这个名字）
+rules:
  - DOMAIN-SUFFIX,fut.gg,PROXY